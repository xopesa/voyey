packages:
  - apps/*
  - packages/*

allowBuilds:
  "@prisma/client": true
  "@prisma/engines": true
  argon2: true
  esbuild: true
  prisma: true

onlyBuiltDependencies:
  - "@prisma/client"
  - "@prisma/engines"
  - prisma
  - esbuild
  - argon2

patchedDependencies:
  avvio@9.3.0: patches/avvio@9.3.0.patch
  find-my-way@9.9.0: patches/find-my-way@9.9.0.patch
