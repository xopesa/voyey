# Disposable compatibility check only. No working database volume or credentials.
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: stenzo_pg15_test
      POSTGRES_USER: stenzo_pg15_test
      POSTGRES_PASSWORD: ${STENZO_PG15_TEST_PASSWORD:?Temporary test password required}
    ports:
      - "127.0.0.1:${STENZO_PG15_TEST_PORT:-55432}:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stenzo_pg15_test -d stenzo_pg15_test"]
      interval: 2s
      timeout: 3s
      retries: 30
