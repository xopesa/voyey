# Application location snippet for the managed api site.
# Integrate into its existing server routing; do not duplicate location /.
# Nginx is the trusted ingress; Node must remain bound to loopback.
location / {
    proxy_pass http://127.0.0.1:10009;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
    # Prefer the overwritten TCP peer; keep the peer last in XFF for fallback.
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_cache off;
    client_max_body_size 6m;
}
