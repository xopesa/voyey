# Historical PostgreSQL adapter only; the active VOYEY runtime uses D1.
# No service starts with default `docker compose up` at stage 1.1.
name: voyey-legacy-inactive
services:
  postgres:
    profiles: ["legacy-disabled"]
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-voyey_legacy}
      POSTGRES_USER: ${POSTGRES_USER:-voyey_legacy}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Legacy PostgreSQL is disabled for this stage}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - voyey_legacy_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD",
          "pg_isready",
          "-U",
          "${POSTGRES_USER:-voyey_legacy}",
          "-d",
          "${POSTGRES_DB:-voyey_legacy}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  voyey_legacy_postgres_data:
