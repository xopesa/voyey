services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stenzo_wear}
      POSTGRES_USER: ${POSTGRES_USER:-stenzo}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set STENZO POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - stenzo_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD",
          "pg_isready",
          "-U",
          "${POSTGRES_USER:-stenzo}",
          "-d",
          "${POSTGRES_DB:-stenzo_wear}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  stenzo_postgres_data:
